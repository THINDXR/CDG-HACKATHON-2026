<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="ระบบเตือนภัยบนท้องถนนแบบเรียลไทม์ พร้อมแผนที่ 3 มิติ" />
  <title>RoadWarn · เตือนภัยบนท้องถนน</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚠️</text></svg>" />
</head>
<body>
  <div id="map" aria-label="แผนที่สามมิติแสดงจุดเตือนภัย"></div>

  <!-- แถบบนสุด -->
  <header class="topbar glass">
    <div class="brand">
      <div class="brand__mark">⚠️</div>
      <div class="brand__text">
        <strong>RoadWarn</strong>
        <span>เตือนภัยบนท้องถนน</span>
      </div>
    </div>

    <div class="topbar__status">
      <button id="btnTrack" class="pill" type="button">
        <span class="pill__dot"></span>
        <span id="trackLabel">เริ่มติดตามตำแหน่ง</span>
      </button>
      <button id="btnSim" class="pill pill--ghost" type="button">🚙 จำลองการขับ</button>
      <button id="btnSettings" class="icon-btn" type="button" title="ตั้งค่าการแจ้งเตือน" aria-label="ตั้งค่า">⚙️</button>
      <button id="btnPanel" class="icon-btn only-mobile" type="button" aria-label="รายการภัย">☰</button>
    </div>
  </header>

  <!-- แถบแจ้งเตือนใหญ่ -->
  <div id="alertBanner" class="alert-banner" role="alert" aria-live="assertive" hidden>
    <div class="alert-banner__icon" id="alertIcon">⚠️</div>
    <div class="alert-banner__body">
      <strong id="alertTitle">ภัยข้างหน้า</strong>
      <span id="alertMeta">—</span>
    </div>
    <button class="alert-banner__close" id="alertClose" type="button" aria-label="ปิด">✕</button>
  </div>

  <!-- แผงด้านข้าง -->
  <aside id="sidebar" class="sidebar glass">
    <div class="sidebar__head">
      <h2>ภัยใกล้คุณ</h2>
      <span id="sidebarCount" class="chip-count">0</span>
    </div>

    <div class="filters" id="filters" role="group" aria-label="กรองประเภทภัย"></div>
    <div class="filters__actions">
      <button class="link-btn" id="filterAll" type="button">เลือกทั้งหมด</button>
      <button class="link-btn" id="filterNone" type="button">ล้างตัวกรอง</button>
    </div>

    <ul id="hazardList" class="hazard-list"></ul>

    <div class="sidebar__foot">
      <span id="statsLine">—</span>
      <button class="link-btn" id="btnReset" type="button">รีเซ็ตข้อมูลตัวอย่าง</button>
    </div>
  </aside>

  <!-- ปุ่มควบคุมแผนที่ -->
  <div class="map-controls">
    <button class="map-btn compass" id="btnCompass" type="button" title="หันไปทางทิศเหนือ" aria-label="ทิศเหนือ">
      <svg id="compassNeedle" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <polygon points="12,3 15.5,13 12,11 8.5,13" fill="#ff3b30"></polygon>
        <polygon points="12,21 8.5,11 12,13 15.5,11" fill="#8e8e93"></polygon>
      </svg>
    </button>
    <button class="map-btn" id="btn3D" type="button" title="สลับมุมมอง 3 มิติ">3D</button>
    <button class="map-btn" id="btnLayers" type="button" title="สลับแผนที่ดาวเทียม">🛰️</button>
    <button class="map-btn" id="btnLocate" type="button" title="ไปยังตำแหน่งของฉัน">◎</button>
    <div class="map-btn-group">
      <button class="map-btn" id="btnZoomIn" type="button" aria-label="ขยาย">＋</button>
      <button class="map-btn" id="btnZoomOut" type="button" aria-label="ย่อ">－</button>
    </div>
  </div>

  <!-- ปุ่มแจ้งเหตุ -->
  <button id="btnReport" class="fab" type="button">
    <span class="fab__icon">＋</span>
    <span class="fab__label">แจ้งเหตุ</span>
  </button>

  <!-- การ์ดรายละเอียดภัยที่เลือก -->
  <section id="detailCard" class="detail-card glass" hidden aria-live="polite"></section>

  <!-- ฟอร์มแจ้งเหตุ -->
  <div id="reportSheet" class="sheet-backdrop" hidden>
    <form class="sheet glass" id="reportForm">
      <header class="sheet__head">
        <h2>แจ้งเหตุบนถนน</h2>
        <button type="button" class="icon-btn" id="reportClose" aria-label="ปิด">✕</button>
      </header>

      <label class="field-label">ประเภทเหตุ</label>
      <div class="type-grid" id="typeGrid"></div>

      <span class="field-label">ระดับความรุนแรง</span>
      <div class="segmented" id="severityGroup">
        <button type="button" data-severity="low">เฝ้าระวัง</button>
        <button type="button" data-severity="medium" class="is-active">ระวัง</button>
        <button type="button" data-severity="high">อันตราย</button>
      </div>

      <label class="field-label" for="roadInput">ถนน / สถานที่</label>
      <input id="roadInput" class="text-input" type="text" placeholder="เช่น ถนนพระราม 4 ใกล้แยกคลองเตย" maxlength="80" />

      <label class="field-label" for="noteInput">รายละเอียดเพิ่มเติม</label>
      <textarea id="noteInput" class="text-input" rows="2" placeholder="สิ่งที่ผู้ขับขี่คนอื่นควรรู้" maxlength="240"></textarea>

      <div class="location-row">
        <div>
          <span class="field-label">ตำแหน่ง</span>
          <span id="locationText" class="location-text">กลางจอแผนที่</span>
        </div>
        <button type="button" class="ghost-btn" id="btnPickLocation">เลือกจุดบนแผนที่</button>
      </div>

      <footer class="sheet__foot">
        <button type="button" class="ghost-btn" id="reportCancel">ยกเลิก</button>
        <button type="submit" class="primary-btn">ส่งรายงาน</button>
      </footer>
    </form>
  </div>

  <!-- ตั้งค่า -->
  <div id="settingsSheet" class="sheet-backdrop" hidden>
    <div class="sheet glass">
      <header class="sheet__head">
        <h2>ตั้งค่าการแจ้งเตือน</h2>
        <button type="button" class="icon-btn" id="settingsClose" aria-label="ปิด">✕</button>
      </header>
      <label class="switch-row">
        <span>เสียงเตือน</span>
        <input type="checkbox" id="setSound" />
      </label>
      <label class="switch-row">
        <span>อ่านออกเสียงภาษาไทย</span>
        <input type="checkbox" id="setVoice" />
      </label>
      <label class="switch-row">
        <span>สั่นเตือน (มือถือ)</span>
        <input type="checkbox" id="setVibrate" />
      </label>
      <p class="hint">
        ระบบจะเตือนเมื่อมีภัยอยู่ในเส้นทางข้างหน้าภายในระยะประมาณ 900 เมตร
        และจะไม่เตือนซ้ำจุดเดิมภายใน 5 นาที
      </p>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/map.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
